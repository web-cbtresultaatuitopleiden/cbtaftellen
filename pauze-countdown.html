<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aftellen naar de pauze — Cbt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&display=swap');

  :root {
    /* Cbt Brand Identity Book 2022 */
    --cbt-blue: #14387F;
    --cbt-blue-tint2: #123F59;
    --cbt-blue-tint3: #4777BB;
    --cbt-blue-tint4: #80BFEA;
    --cbt-blue-tint5: #D9EDFC;
    --cbt-yellow: #F59921;
    --cbt-yellow-tint2: #F8AC2D;
    --cbt-yellow-tint3: #FABE4E;
    --cbt-yellow-tint4: #F6D8A5;
    --cbt-darkgrey: #4B4D4C;
    --cbt-darkgrey2: #292C2D;
    --cbt-grey: #E8EDF2;
    --cbt-grey-support: #A1A3A3;
    --cbt-turquoise: #52BBB5;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--cbt-grey);
    font-family: 'Signika', 'Trebuchet MS', sans-serif;
    color: var(--cbt-darkgrey);
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 20px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--white);
    border-radius: 20px;
    padding: 28px 28px 24px;
    position: relative;
    box-shadow: 0 16px 40px rgba(20, 56, 127, 0.14);
  }

  /* Cbt page-corner label, seen throughout the brand book */
  .tag {
    position: absolute;
    top: 0;
    right: 28px;
    background: var(--cbt-yellow);
    color: var(--white);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 7px 16px;
    border-radius: 0 0 8px 8px;
  }

  .brandrow {
    display: flex;
    align-items: center;
    margin-bottom: 22px;
    margin-top: 6px;
  }

  .brandrow svg {
    height: 42px;
    width: auto;
  }

  h1 {
    font-size: 19px;
    font-weight: 700;
    color: var(--cbt-blue);
    margin: 0 0 4px 0;
  }

  .intro {
    font-weight: 400;
    font-size: 13px;
    color: var(--cbt-darkgrey);
    margin: 0 0 18px 0;
  }

  .toggle-group {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .toggle-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1.5px solid var(--cbt-blue);
    background: var(--white);
    color: var(--cbt-blue);
    font-family: 'Signika', 'Trebuchet MS', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .toggle-btn:hover:not(.active) {
    background: var(--cbt-blue-tint5);
  }

  .toggle-btn.active {
    background: var(--cbt-blue);
    color: var(--white);
  }

  /* Signature element: Cbt's documented "grafische overlay" —
     two overlapping circles, grey + yellow, 92% opacity, centered text */
  .overlay-wrap {
    position: relative;
    width: 280px;
    height: 240px;
    margin: 0 auto 22px;
  }

  .bubble-grey {
    position: absolute;
    top: 0;
    left: 0;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: var(--cbt-blue-tint5);
    opacity: 0.92;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .bubble-grey .clock {
    font-weight: 300;
    font-size: 34px;
    color: var(--cbt-blue);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .bubble-grey .clocklabel {
    margin-top: 6px;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--cbt-blue-tint3);
  }

  .bubble-yellow {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: var(--cbt-yellow-tint3);
    opacity: 0.92;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
  }

  .bubble-yellow span {
    font-weight: 600;
    font-size: 13px;
    color: var(--cbt-blue-tint2);
    line-height: 1.25;
  }

  .track {
    height: 8px;
    border-radius: 999px;
    background: var(--cbt-grey);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .fill {
    height: 100%;
    width: 0%;
    background: var(--cbt-yellow);
    border-radius: 999px;
    transition: width 0.6s ease;
  }

  .status {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--cbt-blue);
  }

  .checklist {
    margin-top: 20px;
    padding-left: 0;
    display: none;
  }

  .checklist.show { display: block; }

  .checklist li {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--cbt-blue);
    margin-bottom: 6px;
  }

  .checklist .check {
    width: 16px;
    height: 16px;
    border-radius: 5px;
    background: var(--cbt-yellow);
    color: var(--white);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .footer-note {
    margin-top: 22px;
    text-align: center;
    font-size: 11px;
    font-weight: 300;
    color: var(--cbt-grey-support);
  }
</style>
</head>

    <div class="card">
      <div class="tag">Live countdown</div>

  function getTarget(now, cfg) {
    const t = new Date(now);
    t.setHours(cfg.hour, cfg.minute, 0, 0);
    if (now.getTime() > t.getTime()) {
      t.setDate(t.getDate() + 1);
    }
    return t;
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnPauze').classList.toggle('active', mode === 'pauze');
    document.getElementById('btnEinde').classList.toggle('active', mode === 'einde');
    const cfg = modes[mode];
    document.getElementById('check1').textContent = cfg.checklist[0];
    document.getElementById('check2').textContent = cfg.checklist[1];
    tick();
  }

  function tick() {
    const cfg = modes[currentMode];
    const totalWindowMinutes = (cfg.hour - cfg.dayStartHour) * 60 + cfg.minute;

    const now = new Date();
    const target = getTarget(now, cfg);
    const diffMs = target.getTime() - now.getTime();

    const headline = document.getElementById('headline');
    const introtext = document.getElementById('introtext');
    const clock = document.getElementById('clock');
    const clocklabel = document.getElementById('clocklabel');
    const yellowtext = document.getElementById('yellowtext');
    const status = document.getElementById('status');
    const checklist = document.getElementById('checklist');

    if (diffMs <= 1000) {
      headline.textContent = cfg.doneHeadline;
      introtext.textContent = cfg.doneIntro;
      clock.textContent = cfg.doneEmoji;
      clocklabel.textContent = cfg.doneClockLabel;
      yellowtext.innerHTML = cfg.doneYellow;
      status.textContent = cfg.doneStatus;
      document.getElementById('fill').style.width = '100%';
      checklist.classList.add('show');
      return;
    }

    checklist.classList.remove('show');
    headline.textContent = cfg.headline;
    introtext.textContent = cfg.intro;

    const totalSeconds = Math.floor(diffMs / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    clock.textContent = pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
    clocklabel.textContent = 'uur · min · sec';

    const minutesUntil = diffMs / 60000;
    const progress = Math.min(100, Math.max(0, 100 - (minutesUntil / totalWindowMinutes) * 100));
    document.getElementById('fill').style.width = progress + '%';

    if (minutesUntil <= 5) {
      status.textContent = cfg.almostStatus;
      yellowtext.innerHTML = cfg.almostYellow;
    } else if (minutesUntil <= 30) {
      status.textContent = 'Nog ' + Math.ceil(minutesUntil) + ' minuten te gaan';
      yellowtext.innerHTML = 'Doel<br>' + cfg.targetLabel;
    } else {
      status.textContent = 'Nog ' + hours + ' uur en ' + minutes + ' min te gaan';
      yellowtext.innerHTML = 'Doel<br>' + cfg.targetLabel;
    }
  }

  document.getElementById('btnPauze').addEventListener('click', function () { setMode('pauze'); });
  document.getElementById('btnEinde').addEventListener('click', function () { setMode('einde'); });

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
